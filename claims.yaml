# C-31's scratch tenant's database (2026-10-27).
#
# After svc-onboard was offboarded, this repo serves one more temporary
# tenant, svc-scratch, whose tenant file points here: C-31's "scratch tenant
# onboarded from one file with one database claim, then offboarded", run on
# the engine's narrowed roles. The org could not gain a new repo for it in
# that session, so the name of the tenant and the name of this repo differ;
# nothing in the platform requires them to match. The instance it makes,
# svc-scratch-main, is deleted by a person after the offboarding
# (ADR-0015 §5), and this file is removed then.
databases:
  main:
    engine: POSTGRES_16
    region: us-central1
    size: S
    tier: standard
    backups: false
